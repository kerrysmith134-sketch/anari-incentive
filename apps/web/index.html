<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101318" />
    <link rel="icon" type="image/png" href="/brand/logo-icon.png" />
    <link
      rel="apple-touch-icon"
      type="image/png"
      href="/brand/logo-icon.png"
    />
    <meta
      name="description"
      content="Anari N-Perform operations console — contribution assurance, approvals and reward settlement."
    />
    <title>Anari N-Perform Console</title>
    <script>
      try {
        // Theme contract: storage key "anari-theme" (legacy "anari.theme"
        // still honoured); apply before first paint, default to system.
        const legacy = localStorage.getItem("anari.theme");
        const stored = localStorage.getItem("anari-theme") ?? legacy;
        if (stored === "light" || stored === "dark") {
          document.documentElement.dataset.theme = stored;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
