          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Calculation]
      summary: Create a deterministic calculation run
      description: |
        Amounts are computed by the policy engine using decimal arithmetic and
        largest-remainder allocation. SHADOW runs are used for rehearsal; a
        FORMAL run requires the legal gate and confirmations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalculationRun"
      responses:
        "201":
          description: Created
          content:
            application/json:
