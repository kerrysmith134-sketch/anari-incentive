      tags: [Reporting]
      summary: Report rolling annual policy-review evidence
      description: |
        Aggregates published policy versions, notice acknowledgement coverage,
        appeals (including SLA breaches and outcomes), evaluation drafts and
        decisions, AI proposal acceptance/override/blind-review counts, data
        quality, DSARs, DPIAs and harness evaluation runs for a date window.
        `trustSurvey` and `subgroupImpact` are explicitly reported as
        unavailable until those instruments are collected; this endpoint does
        not itself constitute the annual policy review sign-off.
      parameters:
