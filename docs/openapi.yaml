      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runs]
              properties:
                runs:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: "#/components/schemas/CreateCalculationRun"
      responses:
        "201":
          description: Created runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
