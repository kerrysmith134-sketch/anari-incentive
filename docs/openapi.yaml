      responses:
        "200":
          description: Agent tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Agent]
      summary: Enqueue an agent task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueAgentTask"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/agent-tasks/scan:
    post:
      tags: [Agent]
      summary: Run the proactive scan
      description: Enqueues and runs the default skills (evidence gap, contribution anomaly, settlement readiness) for the tenant.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey:
                  type: string
      responses:
        "200":
          description: Tasks produced by the scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/agent-tasks/{id}:
    get:
      tags: [Agent]
      summary: Get an agent task
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Agent task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agent-tasks/{id}/run:
    post:
      tags: [Agent]
      summary: Run a queued agent task
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Task after execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agent-tasks/{id}/approve:
    post:
      tags: [Agent]
      summary: Approve a pending high-risk agent action
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionId, approverPersonId]
              properties:
                actionId:
                  $ref: "#/components/schemas/Uuid"
                approverPersonId:
                  $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Approved and executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvariantViolation"

  /api/v1/agent-tasks/{id}/reject:
    post:
      tags: [Agent]
      summary: Reject a pending high-risk agent action
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionId, approverPersonId, reason]
              properties:
                actionId:
                  $ref: "#/components/schemas/Uuid"
                approverPersonId:
                  $ref: "#/components/schemas/Uuid"
                reason:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    devTenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    devUserHeader:
      type: apiKey
      in: header
      name: X-User-Id

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    PersonIdPath:
      name: personId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The caller lacks the required role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Object not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    StateConflict:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Blocked:
      description: Money-path precondition failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvariantViolation:
      description: Domain invariant violated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Uuid:
      type: string
      format: uuid
      example: "00000000-0000-4000-8000-000000000001"

    Decimal:
      type: string
      pattern: "^-?\\d+(\\.\\d+)?$"
      example: "100000.00"

    DataEnvelope:
      type: object
      required: [data]
      properties:
        data:
          description: Endpoint-specific payload
        meta:
          $ref: "#/components/schemas/Meta"

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
        meta:
          $ref: "#/components/schemas/Meta"

    Meta:
      type: object
      properties:
        correlation_id:
          type: string

    CreateWorkPackage:
      type: object
      required:
        [title, objective, ownerPersonId, members, acceptanceCriteria]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        objective:
          type: string
          minLength: 3
        ownerPersonId:
          $ref: "#/components/schemas/Uuid"
        members:
          type: array
          minItems: 1
          items:
            type: object
            required: [personId, responsibilityCode, expectedOutput]
            properties:
              personId:
                $ref: "#/components/schemas/Uuid"
              responsibilityCode:
                type: string
              expectedOutput:
                type: string
        acceptanceCriteria:
          type: array
          minItems: 1
          items:
            type: string
        dueAt:
          type: string
          format: date-time

    CreateContributionClaim:
      type: object
      required:
        [workPackageId, claimantPersonId, claimType, claimedContribution, rationale]
      properties:
        workPackageId:
          $ref: "#/components/schemas/Uuid"
        claimantPersonId:
          $ref: "#/components/schemas/Uuid"
        claimType:
          type: string
        claimedContribution:
          type: object
          required: [dimensions, summary]
          properties:
            dimensions:
              type: array
              minItems: 1
              items:
                type: string
            summary:
              type: string
        evidenceRefs:
          type: array
          items:
            type: string
        rationale:
          type: string
          minLength: 3

    CreateAttributionDecision:
      type: object
      required:
        [claimId, adjudicatorPersonId, status, contributionDimensions, rationale]
      properties:
        claimId:
          $ref: "#/components/schemas/Uuid"
        adjudicatorPersonId:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          enum: [CONFIRMED, PARTIALLY_CONFIRMED, REJECTED]
        acceptedFacts:
          type: array
          items:
            type: string
        rejectedFacts:
          type: array
          items:
            type: string
        contributionDimensions:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        rationale:
          type: string
          minLength: 3
        confidenceBand:
          type: string

    RecordLegalGate:
      type: object
      required: [minimumWageChecked, policyApproved, recordedBy]
      properties:
        democraticProcedureRef:
          type: string
        employeeNoticeRef:
          type: string
        dataProtectionAssessmentRef:
          type: string
        minimumWageChecked:
          type: boolean
        policyApproved:
          type: boolean
        recordedBy:
          $ref: "#/components/schemas/Uuid"

    CalculationOrder:
      type: object
      required: [id, grossProfit, currency]
      properties:
        id:
          type: string
        grossProfit:
          $ref: "#/components/schemas/Decimal"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        contractAmount:
          $ref: "#/components/schemas/Decimal"
        cashCollected:
          $ref: "#/components/schemas/Decimal"
        retentionAmount:
          $ref: "#/components/schemas/Decimal"
        projectType:
          type: string
        siteId:
          type: string
        safetyIncidents:
          type: integer
          minimum: 0
        acceptanceStatus:
          type: string
          enum: [ACCEPTED, PENDING, REJECTED]
        invoiceAmount:
          $ref: "#/components/schemas/Decimal"
        creditApproved:
          type: boolean
        qualityHold:
          type: boolean
        channelPartnerId:
          type: string
        channelShare:
          $ref: "#/components/schemas/Decimal"

    Participant:
      type: object
      required: [personId, workPackageId, attributionWeight, role]
      properties:
        personId:
          $ref: "#/components/schemas/Uuid"
        workPackageId:
          $ref: "#/components/schemas/Uuid"
        attributionWeight:
          $ref: "#/components/schemas/Decimal"
        evaluationDecisionId:
          $ref: "#/components/schemas/Uuid"
        role:
          type: string

    CreateCalculationRun:
      type: object
      required: [cycleId, policyVersionId, mode, order, participants]
      properties:
        cycleId:
          $ref: "#/components/schemas/Uuid"
        policyVersionId:
          type: string
        mode:
          type: string
          enum: [SHADOW, FORMAL]
        order:
          $ref: "#/components/schemas/CalculationOrder"
        participants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Participant"

    RecordConfirmation:
      type: object
      required: [personId, targetType, targetId, decision]
      properties:
        personId:
          $ref: "#/components/schemas/Uuid"
        targetType:
          type: string
          enum: [EVALUATION, ATTRIBUTION, CALCULATION, LEDGER, SETTLEMENT]
        targetId:
          $ref: "#/components/schemas/Uuid"
        decision:
          type: string
          enum: [VIEWED, CONFIRMED, OBJECTED]
        reason:
          type: string

    CreateAppeal:
      type: object
      required: [appellantPersonId, targetType, targetId, reasonCode, statement]
      properties:
        appellantPersonId:
          $ref: "#/components/schemas/Uuid"
        targetType:
          type: string
          enum: [ATTRIBUTION, EVALUATION, LEDGER, CALCULATION]
        targetId:
          $ref: "#/components/schemas/Uuid"
        reasonCode:
          type: string
        statement:
          type: string
          minLength: 5

    CreateEvidence:
      type: object
      required:
        [evidenceType, subjectType, subjectId, sourceSystem, normalizedPayload]
      properties:
        evidenceType:
          type: string
        subjectType:
          type: string
        subjectId:
          $ref: "#/components/schemas/Uuid"
        sourceSystem:
          type: string
        sourceUri:
          type: string
        observedAt:
          type: string
          format: date-time
        qualityStatus:
          type: string
          enum: [VALID, MISSING, STALE, CONFLICTED, UNVERIFIED, INVALID]
        normalizedPayload:
          type: object
          additionalProperties: true
        supersedesId:
          $ref: "#/components/schemas/Uuid"
        submittedBy:
          $ref: "#/components/schemas/Uuid"
          description: Employees may only submit as themselves.

    IngestionEvent:
      type: object
      required:
        [sourceRecordId, eventType, subjectType, subjectId, evidenceType, payload]
      properties:
        sourceRecordId:
          type: string
        sourceEventVersion:
          type: string
        eventType:
          type: string
        occurredAt:
          type: string
          format: date-time
        subjectType:
          type: string
        subjectId:
          $ref: "#/components/schemas/Uuid"
        evidenceType:
          type: string
        payload:
          type: object
          additionalProperties: true
        qualityStatus:
          type: string
          enum: [VALID, MISSING, STALE, CONFLICTED, UNVERIFIED, INVALID]
        sourceUri:
          type: string

    IngestionBatch:
      type: object
      required: [sourceSystem, events]
      properties:
        sourceSystem:
          type: string
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/IngestionEvent"

    PolicyDefinition:
      type: object
      required: [code, version, currency, poolRate, poolCap, rounding]
      properties:
        code:
          type: string
        version:
          type: integer
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
        poolRate:
          $ref: "#/components/schemas/Decimal"
        poolCap:
          $ref: "#/components/schemas/Decimal"
        rounding:
          type: string
          enum: [HALF_UP, HALF_EVEN, DOWN]
        cashCollectionWeight:
          $ref: "#/components/schemas/Decimal"
        retentionHoldbackRate:
          $ref: "#/components/schemas/Decimal"
        afterSalesReserveRate:
          $ref: "#/components/schemas/Decimal"
        qualityGate:
          type: object
          properties:
            requireAcceptance:
              type: boolean
            blockOnSafetyIncident:
              type: boolean
        creditGate:
          type: object
          properties:
            requireCreditApproval:
              type: boolean
            blockOnQualityHold:
              type: boolean
        calculator:
          type: string
          enum:
            - SIMPLE_POOL
            - CASH_WEIGHTED_POOL
            - CASH_WEIGHTED_RETENTION_POOL
            - CASH_WEIGHTED_RESERVE_CHANNEL_POOL
        incentiveType:
          type: string
        minimumWage:
          type: object
          properties:
            monthlyMinimum:
              $ref: "#/components/schemas/Decimal"
            checked:
              type: boolean
        evaluation:
          type: object
          description: Optional evaluation weighting; requires approved decision ids per participant.
          required: [dimensionWeights, floor, ceiling]
          properties:
            dimensionWeights:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/Decimal"
            floor:
              $ref: "#/components/schemas/Decimal"
            ceiling:
              $ref: "#/components/schemas/Decimal"
            maxScore:
              $ref: "#/components/schemas/Decimal"

    CreateNotification:
      type: object
      required: [audience, title, body]
      properties:
        recipientPersonId:
          $ref: "#/components/schemas/Uuid"
        audience:
          type: string
          enum: [PERSON, MANAGER, FINANCE, ADMIN]
        title:
          type: string
        body:
          type: string
        sourceType:
          type: string
        sourceId:
          $ref: "#/components/schemas/Uuid"

    CreateDataQualityIssue:
      type: object
      required: [objectType, objectId, issueCode, severity]
      properties:
        objectType:
          type: string
        objectId:
          $ref: "#/components/schemas/Uuid"
        issueCode:
          type: string
        severity:
          type: string
          enum: [INFO, WARNING, BLOCKING]
        details:
          type: object
          additionalProperties: true
        assignedTo:
          $ref: "#/components/schemas/Uuid"

    DataQualityCommand:
      type: object
      required: [command]
      properties:
        command:
          type: string
          enum: [ASSIGN, START, RESOLVE, WAIVE, REOPEN]
        assignedTo:
          $ref: "#/components/schemas/Uuid"
        actorPersonId:
          $ref: "#/components/schemas/Uuid"
        reason:
          type: string

    CreateEvaluationCycle:
      type: object
      required: [name, cycleType, startsAt, endsAt, timezone]
      properties:
        name:
          type: string
        cycleType:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        timezone:
          type: string
        policyVersionId:
          type: string
        rubricVersionId:
          $ref: "#/components/schemas/Uuid"

    CreatePlatformTenant:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
          minLength: 2
        defaultTimezone:
          type: string
        defaultCurrency:
          type: string
          minLength: 3
          maxLength: 3

    CreatePlatformUser:
      type: object
      required: [authSubject, displayName]
      properties:
        authSubject:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email

    AddMembership:
      type: object
      required: [userId, roleCodes]
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        roleCodes:
          type: array
          minItems: 1
          items:
            type: string

    CreatePlatformPerson:
      type: object
      required: [employeeCode, displayName]
      properties:
        employeeCode:
          type: string
        displayName:
          type: string
        employmentStatus:
          type: string
        userId:
          $ref: "#/components/schemas/Uuid"

    LinkPersonUser:
      type: object
      required: [userId]
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"

    CreateOrgNode:
      type: object
      required: [name, nodeType]
      properties:
        name:
          type: string
        nodeType:
          type: string
        parentId:
          $ref: "#/components/schemas/Uuid"

    AssignPersonOrg:
      type: object
      required: [orgNodeId, validFrom]
      properties:
        orgNodeId:
          $ref: "#/components/schemas/Uuid"
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        allocation:
          type: string
          description: Decimal between 0 and 1.

    SetPersonManager:
      type: object
      required: [managerPersonId]
      properties:
        managerPersonId:
          description: Person id, or null to clear the manager.
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"

    CreateRubric:
      type: object
      required: [code, name, dimensions, scoringAnchors, effectiveFrom]
      properties:
        code:
          type: string
        name:
          type: string
        dimensions:
          type: array
          minItems: 1
          items:
            type: string
        scoringAnchors:
          type: object
          additionalProperties: true
        scope:
          type: object
          additionalProperties: true
        effectiveFrom:
          type: string
          description: Effective date (YYYY-MM-DD)

    CreateEvaluationDraft:
      type: object
      required:
        [cycleId, personId, generatedByType, evidenceSnapshotHash, draftPayload]
      properties:
        cycleId:
          $ref: "#/components/schemas/Uuid"
        personId:
          $ref: "#/components/schemas/Uuid"
        generatedByType:
          type: string
          enum: [AGENT, USER, SYSTEM]
        generatedById:
          $ref: "#/components/schemas/Uuid"
        modelProvider:
          type: string
        modelName:
          type: string
        promptVersion:
          type: string
        agentTaskId:
          $ref: "#/components/schemas/Uuid"
        evidenceSnapshotHash:
          type: string
        draftPayload:
          type: object
          additionalProperties: true
        strengths:
          type: array
          items:
            type: string
        counterEvidence:
          type: array
          items:
            type: string
        missingInformation:
          type: array
          items:
            type: string
        uncertainty:
          type: object
          additionalProperties: true

    DecideEvaluationDraft:
      type: object
      required: [reviewerPersonId, rubricVersionId, decision, rationale]
      properties:
        reviewerPersonId:
          $ref: "#/components/schemas/Uuid"
        rubricVersionId:
          $ref: "#/components/schemas/Uuid"
        decision:
          type: string
          enum: [APPROVE, REJECT]
        scores:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 5
        rationale:
          type: string
          minLength: 3

    CreateSettlementBatch:
      type: object
      required: [cycleId]
      properties:
        cycleId:
          $ref: "#/components/schemas/Uuid"
        kind:
          type: string
          enum: [STANDARD, RECOVERY]
          default: STANDARD
        currency:
          type: string
          minLength: 3
          maxLength: 3
        batchNo:
          type: string
          minLength: 1

    SettlementCommand:
      type: object
      required: [command]
      properties:
        command:
          type: string
          enum:
            - RECONCILE
            - SUBMIT
            - APPROVE
            - LOCK
            - EXPORT
            - ACKNOWLEDGE
            - REQUIRE_ADJUSTMENT
            - CANCEL
        actorPersonId:
          $ref: "#/components/schemas/Uuid"
        externalReference:
          type: string
        reason:
          type: string

    ReverseLedgerEntry:
      type: object
      required: [idempotencyKey, reason, approvedBy]
      properties:
        idempotencyKey:
          type: string
        reason:
          type: string
          minLength: 3
        approvedBy:
          $ref: "#/components/schemas/Uuid"

    PublishPolicy:
      type: object
      required: [policy, effectiveFrom, approvedBy]
      properties:
        policy:
          $ref: "#/components/schemas/PolicyDefinition"
        policyVersionId:
          $ref: "#/components/schemas/Uuid"
        effectiveFrom:
          type: string
          format: date-time
        approvedBy:
          $ref: "#/components/schemas/Uuid"
        scope:
          type: object
          additionalProperties: true

    PolicySimulation:
      type: object
      required: [currentPolicyVersionId, proposedPolicy, samples]
      properties:
        currentPolicyVersionId:
          type: string
        proposedPolicy:
          $ref: "#/components/schemas/PolicyDefinition"
        samples:
          type: array
          minItems: 1
          items:
            type: object
            required: [personId, input]
            properties:
              personId:
                $ref: "#/components/schemas/Uuid"
              input:
                $ref: "#/components/schemas/CreateCalculationRun"

    EnqueueAgentTask:
      type: object
      required: [agentType, triggerType, idempotencyKey]
      properties:
        agentType:
          type: string
          enum:
            - EVIDENCE_GAP
            - SETTLEMENT_READINESS
            - CONTRIBUTION_ANOMALY
            - POLICY_PROPOSAL
            - DATA_QUALITY
            - APPEAL_SLA
            - EVALUATION_DRAFT
        triggerType:
          type: string
          enum: [EVENT, SCHEDULE, MANUAL, THRESHOLD]
        triggerRef:
          type: string
        input:
          type: object
          additionalProperties: true
        idempotencyKey:
          type: string
        riskTier:
          type: string
          enum: [T0, T1, T2, T3]
