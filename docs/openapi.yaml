      summary: Export payroll lines as CSV
      description: |
        The CSV is watermarked with tenant, caller and timestamp headers and a
        SHA-256 hash. When PAYROLL_EXPORT is approval-gated, pass a consumed
        approval request id.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: approvalRequestId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: dlpApprovalRequestId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
          description: Required when export DLP is enabled and identifiers are detected.
      responses:
        "200":
          description: CSV payroll file
          headers:
            x-export-classification:
              schema:
                type: string
              description: CONFIDENTIAL
            x-export-watermark:
              schema:
                type: string
              description: tenant:user:timestamp
            x-export-hash:
              schema:
                type: string
              description: sha256 of the CSV body
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

