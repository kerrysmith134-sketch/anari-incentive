  /api/v1/policy-versions:
    get:
      tags: [Policy]
      summary: List policy versions and effective windows
      responses:
        "200":
          description: Policy versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Policy]
      summary: Publish an approved policy version
      description: |
        Creates a PUBLISHED policy version with its content hash, approver and
        effective date. Publication is a governed decision; formal calculations
        remain blocked until the separate legal gate and confirmations exist.
        Agent-driven publication goes through a T3 action approved by a human.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPolicy"
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/policy-versions/{id}/rollback:
    post:
      tags: [Policy]
      summary: Roll back to an earlier policy version
      description: |
        Publishes the content of an earlier version as the next version for the
        same policy code and closes the current effective window. Existing
        versions stay immutable. Requires admin; when an approvalRequestId is
        supplied, newPolicyVersionId is required and the approved POLICY_PUBLISH
        request for that version is consumed.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackPolicy"
      responses:
        "201":
          description: Rolled back as a new published version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/policy-versions/{id}/test-runs:
    get:
      tags: [Policy]
      summary: List policy test suite run history
      description: Returns append-only suite runs for the policy version, newest first.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Test suite history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Policy]
      summary: Run all active test cases for a policy version
      description: |
        Executes every ACTIVE golden case bound to the policy version and
        returns the individual results plus pass/fail counts. A suite with no
        active cases is not considered passed. Retired cases are counted but
        not executed.
