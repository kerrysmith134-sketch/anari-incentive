components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    devTenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    devUserHeader:
      type: apiKey
      in: header
      name: X-User-Id

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    PersonIdPath:
      name: personId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The caller lacks the required role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Object not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    StateConflict:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Blocked:
      description: Money-path precondition failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvariantViolation:
      description: Domain invariant violated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Per-actor rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the window resets
          schema:
            type: integer
        x-ratelimit-limit:
          description: Requests allowed per window
          schema:
            type: integer
        x-ratelimit-remaining:
          description: Requests remaining in the window
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: Request body exceeds BODY_LIMIT_BYTES
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Uuid:
      type: string
      format: uuid
      example: "00000000-0000-4000-8000-000000000001"

    Decimal:
      type: string
      pattern: "^-?\\d+(\\.\\d+)?$"
      example: "100000.00"

    DataEnvelope:
      type: object
      required: [data]
      properties:
        data:
          description: Endpoint-specific payload
        meta:
          $ref: "#/components/schemas/Meta"

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
        meta:
          $ref: "#/components/schemas/Meta"

    Meta:
      type: object
      properties:
        correlation_id:
          type: string

    CreateWorkPackage:
      type: object
      required:
        [title, objective, ownerPersonId, members, acceptanceCriteria]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        objective:
          type: string
          minLength: 3
        packageType:
          type: string
          minLength: 1
          maxLength: 60
          default: ORDER_DELIVERY
        ownerPersonId:
          $ref: "#/components/schemas/Uuid"
        members:
          type: array
          minItems: 1
          items:
            type: object
            required: [personId, responsibilityCode, expectedOutput]
            properties:
              personId:
                $ref: "#/components/schemas/Uuid"
              responsibilityCode:
                type: string
              expectedOutput:
                type: string
        acceptanceCriteria:
          type: array
          minItems: 1
          items:
            type: string
        dueAt:
          type: string
          format: date-time

    CreateClawbackCase:
      type: object
      required:
        [personId, amount, currency, reasonCode, explanation, consentSignatureRef, requestedBy]
      properties:
        personId:
          $ref: "#/components/schemas/Uuid"
        amount:
          $ref: "#/components/schemas/Decimal"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        reasonCode:
          type: string
        explanation:
          type: string
          minLength: 3
        consentSignatureRef:
          type: string
        installmentMonths:
          type: integer
          minimum: 1
          maximum: 12
          default: 1
        hardshipWaiver:
          type: boolean
          default: false
        hardshipReason:
          type: string
        requestedBy:
          $ref: "#/components/schemas/Uuid"

    ApproveClawbackCase:
      type: object
      required: [approvedBy]
      properties:
        approvedBy:
          $ref: "#/components/schemas/Uuid"

    CloseClawbackCase:
      type: object
      required: [reason, actorPersonId]
      properties:
        reason:
          type: string
          minLength: 3
        actorPersonId:
          $ref: "#/components/schemas/Uuid"

    CreateBreakGlassGrant:
      type: object
      required:
        [scope, granteePersonId, reason, grantedBy, expiresAt]
      properties:
        scope:
          type: string
          enum: [PAYROLL_BANK_ACCOUNT]
        granteePersonId:
          $ref: "#/components/schemas/Uuid"
        reason:
          type: string
          minLength: 5
        grantedBy:
          $ref: "#/components/schemas/Uuid"
        expiresAt:
          type: string
          format: date-time

    CreatePilotEnrollment:
      type: object
      required: [personId, pilotCode, scope, consentSignatureRef]
      properties:
        personId:
          $ref: "#/components/schemas/Uuid"
        pilotCode:
          type: string
        scope:
          type: string
        consentSignatureRef:
          type: string
        consentSignedAt:
          type: string
          format: date-time

    CreateManagerTrainingRecord:
      type: object
      required: [personId, trainingCode, title, completedAt]
      properties:
        personId:
          $ref: "#/components/schemas/Uuid"
        trainingCode:
          type: string
        title:
          type: string
        completedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        evidenceRef:
          type: string

    CreateCalibrationSession:
      type: object
      required:
        [code, title, heldAt, facilitatorPersonId, attendeePersonIds]
      properties:
        code:
          type: string
        title:
          type: string
        heldAt:
          type: string
          format: date-time
        facilitatorPersonId:
          $ref: "#/components/schemas/Uuid"
        attendeePersonIds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Uuid"
        policyVersionId:
          $ref: "#/components/schemas/Uuid"
        notes:
          type: string

    CreateFairnessCommitment:
      type: object
      required: [statement, ownerPersonId]
      properties:
        statement:
          type: string
          minLength: 10
        ownerPersonId:
          $ref: "#/components/schemas/Uuid"
        channels:
          type: array
          items:
            type: string

    CreateModelRedTeamRun:
      type: object
      required:
        [modelProvider, modelName, promptVersion, scope, testsRun, passed, createdBy]
      properties:
        modelProvider:
          type: string
        modelName:
          type: string
        promptVersion:
          type: string
        scope:
          type: string
          minLength: 3
        testsRun:
          type: integer
          minimum: 1
        passed:
          type: boolean
        findings:
          type: array
          items:
            type: string
        artifactRef:
          type: string
        createdBy:
          $ref: "#/components/schemas/Uuid"

    CreateAuditRedaction:
      type: object
      required: [reason, requestedBy, approvedBy]
      properties:
        reason:
          type: string
          minLength: 5
        replacement:
          type: string
          default: "[REDACTED]"
        requestedBy:
          $ref: "#/components/schemas/Uuid"
        approvedBy:
          $ref: "#/components/schemas/Uuid"

    RefreshModelEvaluationDataset:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        name:
          type: string
        sampleSize:
          type: integer
          minimum: 2
        holdoutSize:
          type: integer
          minimum: 1
        refreshedAt:
          type: string
          format: date-time
        nextRefreshDueAt:
          type: string
          format: date-time
        contentHash:
          type: string
        ownerPersonId:
          $ref: "#/components/schemas/Uuid"

    CreateModelCanaryRun:
      type: object
      required:
        [baselineEvaluationRunId, candidateEvaluationRunId, datasetRef, trafficPercent]
      properties:
        baselineEvaluationRunId:
          $ref: "#/components/schemas/Uuid"
        candidateEvaluationRunId:
          $ref: "#/components/schemas/Uuid"
        datasetRef:
          type: string
        trafficPercent:
          type: number
          minimum: 1
          maximum: 100

    CreateModelEvaluationDataset:
      type: object
      required:
        [code, name, sampleSize, holdoutSize, labelSource, ownerPersonId]
      properties:
        code:
          type: string
        version:
          type: integer
          minimum: 1
          default: 1
        name:
          type: string
        sampleSize:
          type: integer
          minimum: 2
        holdoutSize:
          type: integer
          minimum: 1
        labelSource:
          type: string
        ownerPersonId:
          $ref: "#/components/schemas/Uuid"
        refreshedAt:
          type: string
          format: date-time
        nextRefreshDueAt:
          type: string
          format: date-time
        contentHash:
          type: string

    CreateModelProviderPolicy:
      type: object
      required:
        [provider, zeroRetentionConfirmed, dpaRef, inferenceRegion, egressAllowlist, approvedBy]
      properties:
        provider:
          type: string
        zeroRetentionConfirmed:
          type: boolean
        dpaRef:
          type: string
        inferenceRegion:
          type: string
        egressAllowlist:
          type: array
          minItems: 1
          items:
            type: string
        approvedBy:
          $ref: "#/components/schemas/Uuid"

    CreateTrustSurvey:
      type: object
      required: [code, period, title, questions]
      properties:
        code:
          type: string
        period:
          type: string
        title:
          type: string
        questions:
          type: array
          minItems: 1
