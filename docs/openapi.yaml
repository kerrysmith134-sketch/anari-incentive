openapi: 3.1.0
info:
  title: N-Perform Incentive API
  version: 0.1.0
  description: |
    Institution-agnostic contribution attribution and incentive settlement
    assurance layer. The API core contains no industry policy: policy
    definitions are loaded from policy packs and selected by `calculator`.

    All `/api/v1` requests require authentication. In `AUTH_MODE=oidc` send a
    bearer JWT; in development the `X-Tenant-Id` / `X-User-Id` headers are
    accepted by `DevHeaderAuthenticator`.

    When `RATE_LIMIT_PER_MINUTE` is enabled, `/api/v1` requests over the
    per-actor limit return `429 RATE_LIMITED` with `Retry-After` and
    `x-ratelimit-*` headers. Bodies over `BODY_LIMIT_BYTES` (default 1 MiB)
    return `413 PAYLOAD_TOO_LARGE`. Both use the standard error envelope.
  license:
    name: Proprietary
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
  - devTenantHeader: []
    devUserHeader: []
tags:
  - name: System
  - name: Work packages
  - name: Equity
  - name: Bounty
  - name: Payroll
  - name: Contribution claims
  - name: Attribution
  - name: Evaluation
  - name: Notifications
  - name: Platform
  - name: Policy
  - name: Calculation
  - name: Confirmations
  - name: Compliance
  - name: Approvals
  - name: Budget
  - name: Ledger
  - name: Appeals
  - name: Evidence
  - name: Ingestion
  - name: Agent
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"

  /api/v1/work-packages:
    get:
      tags: [Work packages]
      summary: List work packages
      responses:
        "200":
          description: Work packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Work packages]
      summary: Create a draft work package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkPackage"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/work-packages:accept-batch:
    post:
      tags: [Work packages]
      summary: Accept up to 50 submitted work packages atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [id, reviewerPersonId]
                    properties:
                      id:
                        $ref: "#/components/schemas/Uuid"
                      reviewerPersonId:
                        $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Accepted work packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/work-packages/{id}:
    get:
      tags: [Work packages]
      summary: Get a work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Work package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/work-packages/{id}/versions:
    get:
      tags: [Work packages]
      summary: List commitment snapshots for a work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Version snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/work-packages/{id}/commit:
    post:
      tags: [Work packages]
      summary: Commit a draft work package using optimistic version check
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/work-packages/{id}/start:
    post:
      tags: [Work packages]
      summary: Start an active work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/work-packages/{id}/submit:
    post:
      tags: [Work packages]
      summary: Submit a work package for acceptance
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/work-packages/{id}/accept:
    post:
      tags: [Work packages]
      summary: Accept a delivered work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerPersonId]
              properties:
                reviewerPersonId:
                  $ref: "#/components/schemas/Uuid"
                comments:
                  type: string
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvariantViolation"

  /api/v1/work-packages/{id}/reject:
    post:
      tags: [Work packages]
      summary: Reject a delivered work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerPersonId, reason]
              properties:
                reviewerPersonId:
                  $ref: "#/components/schemas/Uuid"
                reason:
                  type: string
                  minLength: 3
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/contribution-assessment-drafts:
    get:
      tags: [Contribution assessment drafts]
      summary: List contribution assessment drafts
      parameters:
        - name: claimId
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, DECIDED, DISCARDED]
      responses:
        "200":
          description: Drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Contribution assessment drafts]
      summary: Create an assessment draft (assertions require evidence refs; no default percentages)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContributionAssessmentDraft"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: ACTIVITY event referenced or assertion missing evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
  /api/v1/contribution-assessment-drafts/{id}:
    get:
      tags: [Contribution assessment drafts]
      summary: Get one assessment draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/contribution-assessment-drafts/{id}/submit:
    post:
      tags: [Contribution assessment drafts]
      summary: Submit a draft for human review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Submitted draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
  /api/v1/contribution-assessment-drafts/{id}/discard:
    post:
      tags: [Contribution assessment drafts]
      summary: Discard a draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Discarded draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
  /api/v1/contribution-assessment-drafts/{id}/link-decision:
    post:
      tags: [Contribution assessment drafts]
      summary: Link a submitted draft to an existing human attribution decision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attributionDecisionId, linkedBy]
              properties:
                attributionDecisionId:
                  $ref: "#/components/schemas/Uuid"
                linkedBy:
                  $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Draft linked to the human decision (DECIDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "404":
          description: Decision not found — human decision must exist first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"

  /api/v1/contribution-events:
    get:
      tags: [Contribution events]
      summary: List contribution events (facts, not attributions)
      parameters:
        - name: subjectPersonId
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: kind
          in: query
          schema:
            type: string
            enum: [CONTRIBUTION, ACTIVITY, CONTEXT]
        - name: source
          in: query
          schema:
            type: string
        - name: occurredFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: occurredTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Contribution events]
      summary: Record a contribution event (ACTIVITY events are observations, not attribution)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContributionEvent"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/v1/contribution-events:ingest:
    post:
      tags: [Contribution events]
      summary: Batch-ingest contribution events (idempotent per source+externalId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionEventBatch"
      responses:
        "201":
          description: Ingest result with inserted/duplicate ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/v1/contribution-events/{id}:
    get:
      tags: [Contribution events]
      summary: Get one contribution event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/contribution-claims:
    get:
      tags: [Contribution claims]
      summary: List contribution claims
      responses:
        "200":
          description: Claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Contribution claims]
      summary: Create a contribution claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContributionClaim"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/contribution-claims/{id}:
    get:
      tags: [Contribution claims]
      summary: Get a contribution claim
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/contribution-claims/{id}/submit:
    post:
      tags: [Contribution claims]
      summary: Submit a draft claim
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/contribution-attestations:
    get:
      tags: [Contribution]
      summary: List peer and manager attestations
      parameters:
        - name: workPackageId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: subjectPersonId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Attestations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Contribution]
      summary: Record a peer or manager attestation
      description: |
        The subject must participate in the work package and cannot attest
        their own contribution. A MANAGER attestation requires the attester to
        be the subject's current manager.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContributionAttestation"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/contribution-attestations/{id}/withdraw:
    post:
      tags: [Contribution]
      summary: Withdraw an attestation
      description: Only the original attester can withdraw.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                personId:
                  $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/conflict-declarations:
    get:
      tags: [Contribution]
      summary: List related-party conflict declarations
      parameters:
        - name: personId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Conflict declarations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Contribution]
      summary: Declare a related-party conflict
      description: An active declaration blocks adjudication between the pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConflictDeclaration"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/conflict-declarations/{id}/revoke:
    post:
      tags: [Contribution]
      summary: Revoke a conflict declaration
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeConflictDeclaration"
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clawback-cases:
    get:
      tags: [Payroll]
      summary: List clawback cases
      parameters:
        - name: personId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Clawback cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Payroll]
      summary: Record clawback terms and consent
      description: |
        Records written consent, installment months and optional hardship
        terms. It does not itself move money; recovery still uses a
        settlement-recovery batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClawbackCase"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/clawback-cases/{id}/approve:
    post:
      tags: [Payroll]
      summary: Approve clawback terms
      description: The requester cannot approve the case.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveClawbackCase"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/clawback-cases/{id}/waive:
    post:
      tags: [Payroll]
      summary: Waive a clawback
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseClawbackCase"
      responses:
        "200":
          description: Waived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/clawback-cases/{id}/cancel:
    post:
      tags: [Payroll]
      summary: Cancel a clawback
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseClawbackCase"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/clawback-cases/{id}/schedule:
    get:
      tags: [Payroll]
      summary: Preview clawback installments against wage-protection limits
      description: |
        Uses the active employment contract to check each installment against
        the 20% deduction cap and the minimum-wage floor. A blocked installment
        must not be collected without a lawful adjustment.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Installment schedule and checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
