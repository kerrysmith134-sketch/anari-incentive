  /api/v1/evaluation-cycles/{id}/advance:
    post:
      tags: [Evaluation]
      summary: 推进考核周期状态机
      description: >
        DRAFT → COLLECTING → AI_PRE_REVIEW → HUMAN_REVIEW → DECIDED →
        CALCULATING → SETTLED。HUMAN_REVIEW 前必须有 AGENT 预审草稿；
        DECIDED 前所有草稿必须已决策；写入审计链。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceCycle"
      responses:
        "200":
          description: 已推进
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "409":
          $ref: "#/components/responses/StateConflict"
  /api/v1/calculation-runs:from-ingestion:
    post:
      tags: [Rewards]
      summary: 从摄取订单物化影子计算批次（CRM/ERP → 计算适配）
      description: >
        取指定来源系统在周期窗口内的有效订单证据，按外部身份映射解析参与人，
        逐单创建影子计算批次；同一外部订单幂等（ALREADY_MATERIALIZED 跳过），
        无映射/无毛利则跳过并给出原因。不写金额入账本（锁定仍走审批）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunsFromIngestion"
      responses:
        "200":
          description: 物化结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/evaluation-cycles/{id}/pre-review:
    post:
      tags: [Evaluation]
      summary: AI 预审——为周期生成证据 bound 的 AGENT 评价草稿
      description: >
        AI-04 草稿生成 workflow（PRD §7.4 三个 bounded workflow 之一）。按周期窗口
        汇总申报人的证据覆盖，生成 builtin/evidence-coverage-v1 的 AGENT 草稿
        （无分数），并写入 AI 建议日志；幂等（同人同周期仅一次）。AI 只产草稿，
        决策必须由人工作出。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreReview"
      responses:
        "200":
          description: 生成的草稿与跳过项
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/model-evaluation-datasets:import:
    post:
      tags: [AI]
      summary: 金标集批量导入（AI-02 落地）
      description: >
        一次登记标注数据集与全部样本（双人工分 + 模型分 + 对抗结果）。
        服务端计算样本/留出规模与内容哈希；导入后即可运行评测台（harness），
        通过后解锁提示词激活与数值评分提案。
      requestBody:
