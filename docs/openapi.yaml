    post:
      tags: [Payroll]
      summary: Generate the clawback recovery adjustment and batch
      description: >
        Requires an APPROVED clawback case. Appends a locked negative ledger
        adjustment (idempotent per case) and, unless createBatch=false, opens a
        RECOVERY settlement batch for the cycle whose negative lines require
        the affected people's SETTLEMENT confirmation before locking.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateClawbackRecovery"
