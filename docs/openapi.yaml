components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    devTenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    devUserHeader:
      type: apiKey
      in: header
      name: X-User-Id

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    PersonIdPath:
      name: personId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The caller lacks the required role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Object not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    StateConflict:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Blocked:
      description: Money-path precondition failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvariantViolation:
      description: Domain invariant violated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Uuid:
      type: string
      format: uuid
      example: "00000000-0000-4000-8000-000000000001"

    Decimal:
      type: string
      pattern: "^-?\\d+(\\.\\d+)?$"
      example: "100000.00"

    DataEnvelope:
      type: object
      required: [data]
      properties:
        data:
          description: Endpoint-specific payload
        meta:
          $ref: "#/components/schemas/Meta"

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
        meta:
          $ref: "#/components/schemas/Meta"

    Meta:
      type: object
      properties:
        correlation_id:
          type: string

    CreateWorkPackage:
      type: object
      required:
        [title, objective, ownerPersonId, members, acceptanceCriteria]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        objective:
          type: string
          minLength: 3
        ownerPersonId:
          $ref: "#/components/schemas/Uuid"
        members:
          type: array
          minItems: 1
          items:
            type: object
            required: [personId, responsibilityCode, expectedOutput]
            properties:
              personId:
                $ref: "#/components/schemas/Uuid"
              responsibilityCode:
                type: string
              expectedOutput:
                type: string
        acceptanceCriteria:
          type: array
          minItems: 1
          items:
            type: string
        dueAt:
          type: string
          format: date-time

    CreateContributionClaim:
      type: object
      required:
        [workPackageId, claimantPersonId, claimType, claimedContribution, rationale]
      properties:
        workPackageId:
          $ref: "#/components/schemas/Uuid"
        claimantPersonId:
          $ref: "#/components/schemas/Uuid"
        claimType:
          type: string
        claimedContribution:
          type: object
          required: [dimensions, summary]
          properties:
            dimensions:
              type: array
              minItems: 1
              items:
                type: string
            summary:
              type: string
        evidenceRefs:
          type: array
          items:
            type: string
        rationale:
          type: string
          minLength: 3

    CreateAttributionDecision:
      type: object
      required:
        [claimId, adjudicatorPersonId, status, contributionDimensions, rationale]
      properties:
        claimId:
          $ref: "#/components/schemas/Uuid"
        adjudicatorPersonId:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          enum: [CONFIRMED, PARTIALLY_CONFIRMED, REJECTED]
        acceptedFacts:
          type: array
          items:
            type: string
        rejectedFacts:
          type: array
          items:
            type: string
        contributionDimensions:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        rationale:
          type: string
          minLength: 3
        confidenceBand:
          type: string

    RecordLegalGate:
      type: object
      required: [minimumWageChecked, policyApproved, recordedBy]
      properties:
        democraticProcedureRef:
          type: string
        democraticProcedureId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: When supplied, the consultation must belong to this policy version and be concluded; the consultation id becomes the democraticProcedureRef.
        employeeNoticeRef:
          type: string
        employeeNoticeId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: When supplied, coverage must be complete if the notice requires acknowledgement; the notice id becomes the employeeNoticeRef.
        dataProtectionAssessmentRef:
          type: string
        dataProtectionAssessmentId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: When supplied, the DPIA must be APPROVED; the assessment id becomes the dataProtectionAssessmentRef.
        minimumWageChecked:
          type: boolean
        policyApproved:
          type: boolean
        recordedBy:
          $ref: "#/components/schemas/Uuid"

    CreateNotice:
      type: object
      required: [noticeType, title, bodyRef, effectiveFrom]
      properties:
        noticeType:
          type: string
          enum: [POLICY, PAY_PLAN, AI_USE, DATA_PROCESSING, OTHER]
        title:
          type: string
        bodyRef:
          type: string
        policyVersionId:
          $ref: "#/components/schemas/Uuid"
        publishedAt:
          type: string
          format: date-time
        effectiveFrom:
          type: string
          format: date-time
        acknowledgementRequired:
          type: boolean
          default: true

    RecordAcknowledgement:
      type: object
      required: [personId, decision]
      properties:
        personId:
          $ref: "#/components/schemas/Uuid"
        decision:
          type: string
          enum: [ACKNOWLEDGE, DECLINE]
        signatureRef:
          type: string
        declineReason:
          type: string
          description: Required when decision is DECLINE.

    CreateEmployeeRepresentation:
      type: object
      required: [bodyName, bodyType, jurisdiction]
      properties:
        bodyName:
          type: string
        bodyType:
          type: string
          enum: [WORKS_COUNCIL, UNION, EMPLOYEE_REP, ALL_EMPLOYEES]
        jurisdiction:
          type: string

    CreatePolicyConsultation:
      type: object
      required: [policyVersionId, consultationType, startedAt]
      properties:
        policyVersionId:
          $ref: "#/components/schemas/Uuid"
        representationId:
          $ref: "#/components/schemas/Uuid"
        consultationType:
          type: string
          enum: [DISCUSSION, COMMENT_PERIOD, NEGOTIATION, INFORMATION]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        minutesRef:
          type: string
        feedbackSummary:
          type: string
        outcome:
          type: string
          enum: [PENDING, AGREED, NO_AGREEMENT, INFORMATION_ONLY, CLOSED]
          default: PENDING

    ConcludePolicyConsultation:
      type: object
      required: [endedAt, outcome]
      properties:
        endedAt:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [AGREED, NO_AGREEMENT, INFORMATION_ONLY, CLOSED]
        minutesRef:
          type: string
        feedbackSummary:
          type: string

    CreateDpia:
      type: object
      required: [assessmentType, scope]
      properties:
        assessmentType:
          type: string
          enum: [DPIA, PIPIA]
        scope:
          type: string
        riskSummary:
          type: object
          additionalProperties: true
        mitigationSummary:
          type: object
          additionalProperties: true

    ApproveDpia:
      type: object
      required: [approvedBy]
      properties:
        approvedBy:
          $ref: "#/components/schemas/Uuid"

    CreateDsar:
      type: object
      required: [requestType]
      properties:
        personId:
          $ref: "#/components/schemas/Uuid"
        requestType:
          type: string
          enum: [ACCESS, CORRECTION, DELETION, EXPLANATION, OBJECTION]
        dueAt:
          type: string
          format: date-time

    ResolveDsar:
      type: object
      required: [resolution, resolutionRef]
      properties:
        resolution:
          type: string
          enum: [RESOLVED, REJECTED]
        resolutionRef:
          type: string

    CreateRecalculationRequest:
      type: object
      required: [targetType, targetId, reasonCode, explanation, requestedBy]
      properties:
        targetType:
          type: string
          enum: [EVIDENCE, ATTRIBUTION, EVALUATION, LEDGER]
        targetId:
          $ref: "#/components/schemas/Uuid"
        reasonCode:
          type: string
        explanation:
          type: string
        requestedBy:
          $ref: "#/components/schemas/Uuid"

    ReviewRecalculationRequest:
      type: object
      required: [approvedBy]
      properties:
        approvedBy:
          $ref: "#/components/schemas/Uuid"

    CompleteRecalculationRequest:
      type: object
