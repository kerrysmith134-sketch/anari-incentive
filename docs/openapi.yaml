          type: string
        acknowledgedAt:
          type: string
          format: date-time

    PublishPolicy:
      type: object
      required: [policy, effectiveFrom, approvedBy]
      properties:
        policy:
          $ref: "#/components/schemas/PolicyDefinition"
        policyVersionId:
          $ref: "#/components/schemas/Uuid"
        effectiveFrom:
          type: string
          format: date-time
        approvedBy:
          $ref: "#/components/schemas/Uuid"
        scope:
          type: object
          additionalProperties: true
        approvalRequestId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: When supplied, policyVersionId is required and the approved POLICY_PUBLISH request for that version is consumed.

    PolicySimulation:
      type: object
      required: [currentPolicyVersionId, proposedPolicy, samples]
      properties:
        currentPolicyVersionId:
          type: string
        proposedPolicy:
          $ref: "#/components/schemas/PolicyDefinition"
        samples:
          type: array
          minItems: 1
          items:
            type: object
            required: [personId, input]
            properties:
              personId:
                $ref: "#/components/schemas/Uuid"
              input:
                $ref: "#/components/schemas/CreateCalculationRun"

    EnqueueAgentTask:
      type: object
      required: [agentType, triggerType, idempotencyKey]
      properties:
        agentType:
          type: string
          enum:
            - EVIDENCE_GAP
            - SETTLEMENT_READINESS
            - CONTRIBUTION_ANOMALY
            - POLICY_PROPOSAL
            - DATA_QUALITY
            - APPEAL_SLA
            - EVALUATION_DRAFT
        triggerType:
          type: string
          enum: [EVENT, SCHEDULE, MANUAL, THRESHOLD]
        triggerRef:
          type: string
        input:
          type: object
          additionalProperties: true
        idempotencyKey:
          type: string
        riskTier:
          type: string
          enum: [T0, T1, T2, T3]
