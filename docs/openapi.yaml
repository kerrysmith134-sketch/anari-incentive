        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                approvalRequestId:
                  allOf:
                    - $ref: "#/components/schemas/Uuid"
                  description: When supplied, the approved CALCULATION_APPROVE request for this run is consumed.
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/calculation-runs/{id}/lock:
    post:
      tags: [Calculation]
      summary: Lock an approved calculation and post it to the ledger
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  const: LOCK_CALCULATION
                approvalRequestId:
                  allOf:
                    - $ref: "#/components/schemas/Uuid"
                  description: When supplied, the approved CALCULATION_LOCK request for this run is consumed.
      responses:
        "200":
          description: Locked
          content:
