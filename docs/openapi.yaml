openapi: 3.1.0
info:
  title: N-Perform Incentive API
  version: 0.1.0
  description: |
    Institution-agnostic contribution attribution and incentive settlement
    assurance layer. The API core contains no industry policy: policy
    definitions are loaded from policy packs and selected by `calculator`.

    All `/api/v1` requests require authentication. In `AUTH_MODE=oidc` send a
    bearer JWT; in development the `X-Tenant-Id` / `X-User-Id` headers are
    accepted by `DevHeaderAuthenticator`.
  license:
    name: Proprietary
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
  - devTenantHeader: []
    devUserHeader: []
tags:
  - name: System
  - name: Work packages
  - name: Contribution claims
  - name: Attribution
  - name: Evaluation
  - name: Notifications
  - name: Platform
  - name: Policy
  - name: Calculation
  - name: Confirmations
  - name: Ledger
  - name: Appeals
  - name: Evidence
  - name: Ingestion
  - name: Agent
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"

  /api/v1/work-packages:
    get:
      tags: [Work packages]
      summary: List work packages
      responses:
        "200":
          description: Work packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Work packages]
      summary: Create a draft work package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkPackage"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/work-packages:accept-batch:
    post:
      tags: [Work packages]
      summary: Accept up to 50 submitted work packages atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [id, reviewerPersonId]
                    properties:
                      id:
                        $ref: "#/components/schemas/Uuid"
                      reviewerPersonId:
                        $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Accepted work packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/work-packages/{id}:
    get:
      tags: [Work packages]
      summary: Get a work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Work package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/work-packages/{id}/versions:
    get:
      tags: [Work packages]
      summary: List commitment snapshots for a work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Version snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/work-packages/{id}/commit:
    post:
      tags: [Work packages]
      summary: Commit a draft work package using optimistic version check
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/work-packages/{id}/start:
    post:
      tags: [Work packages]
      summary: Start an active work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/work-packages/{id}/submit:
    post:
      tags: [Work packages]
      summary: Submit a work package for acceptance
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/work-packages/{id}/accept:
    post:
      tags: [Work packages]
      summary: Accept a delivered work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerPersonId]
              properties:
                reviewerPersonId:
                  $ref: "#/components/schemas/Uuid"
                comments:
                  type: string
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvariantViolation"

  /api/v1/work-packages/{id}/reject:
    post:
      tags: [Work packages]
      summary: Reject a delivered work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerPersonId, reason]
              properties:
                reviewerPersonId:
                  $ref: "#/components/schemas/Uuid"
                reason:
                  type: string
                  minLength: 3
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/contribution-claims:
    get:
      tags: [Contribution claims]
      summary: List contribution claims
      responses:
        "200":
          description: Claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Contribution claims]
      summary: Create a contribution claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContributionClaim"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/contribution-claims/{id}:
    get:
      tags: [Contribution claims]
      summary: Get a contribution claim
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/contribution-claims/{id}/submit:
    post:
      tags: [Contribution claims]
      summary: Submit a draft claim
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/attribution-decisions:batch:
    post:
      tags: [Attribution]
      summary: Record up to 50 attribution decisions atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: "#/components/schemas/CreateAttributionDecision"
      responses:
        "201":
          description: Created decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvariantViolation"

  /api/v1/attribution-decisions:
    get:
      tags: [Attribution]
      summary: List attribution decisions
      parameters:
        - name: claimId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Attribution]
      summary: Record an attribution decision
      description: The adjudicator must not be the claimant; an independent reviewer is enforced by domain invariants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttributionDecision"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvariantViolation"

  /api/v1/policy-versions/{id}/diff:
    get:
      tags: [Policy]
      summary: Structural diff against another policy version
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: against
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Policy changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/policy-versions/{id}/legal-gate:
    get:
      tags: [Policy]
      summary: Read the legal gate for a policy version
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Legal gate status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Policy]
      summary: Record legal gate evidence
      description: A formal calculation is blocked until the legal gate is recorded and approved.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordLegalGate"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/calculation-runs:batch:
    post:
      tags: [Calculation]
      summary: Create up to 50 calculation runs atomically
      description: All runs commit in one transaction; if any item is blocked, none are persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runs]
              properties:
                runs:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: "#/components/schemas/CreateCalculationRun"
      responses:
        "201":
          description: Created runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Blocked"

  /api/v1/calculation-runs:
    get:
      tags: [Calculation]
      summary: List calculation runs
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Calculation]
      summary: Create a deterministic calculation run
      description: |
        Amounts are computed by the policy engine using decimal arithmetic and
        largest-remainder allocation. SHADOW runs are used for rehearsal; a
        FORMAL run requires the legal gate and confirmations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalculationRun"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Blocked"

  /api/v1/calculation-runs/{id}:
    get:
      tags: [Calculation]
      summary: Get a calculation run
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/calculation-runs/{id}/approve:
    post:
      tags: [Calculation]
      summary: Approve a draft calculation run
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/calculation-runs/{id}/lock:
    post:
      tags: [Calculation]
      summary: Lock an approved calculation and post it to the ledger
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  const: LOCK_CALCULATION
      responses:
        "200":
          description: Locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Blocked"

  /api/v1/employee-confirmations:
    get:
      tags: [Confirmations]
      summary: List employee confirmations
      parameters:
        - name: personId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Confirmations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Confirmations]
      summary: Record an employee confirmation or objection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordConfirmation"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ledger:
    get:
      tags: [Ledger]
      summary: List append-only ledger entries with hash chain
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ledger/verify:
    get:
      tags: [Ledger]
      summary: Verify the tenant hash chain
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ledger/{id}/reverse:
    post:
      tags: [Ledger]
      summary: Append a locked reversal for a locked ledger entry
      description: Creates a negative ledger entry linked to the original. The original stays locked; the reversal participates in the same tenant hash chain.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseLedgerEntry"
      responses:
        "201":
          description: Reversal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/audit-events:
    get:
      tags: [Ledger]
      summary: List append-only audit events
      description: Hash-chained tenant audit events, newest first. Requires manager or finance (admin passes).
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit-events/verify:
    get:
      tags: [Ledger]
      summary: Verify the tenant audit hash chain
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/settlement-batches:
    get:
      tags: [Ledger]
      summary: List settlement batches
      responses:
        "200":
          description: Settlement batches with lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Ledger]
      summary: Create a settlement batch from locked ledger entries
      description: |
        Collects LOCKED ledger entries for the cycle that are not already in an
        active settlement batch. The batch starts in DRAFT with one line per
        ledger entry; totals reconcile from those lines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSettlementBatch"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/settlement-batches/{id}:
    get:
      tags: [Ledger]
      summary: Get a settlement batch with lines
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Settlement batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/settlement-batches/{id}/commands:
    post:
      tags: [Ledger]
      summary: Run an explicit settlement command
      description: |
        Commands advance the canonical settlement state machine:
        RECONCILE, SUBMIT, APPROVE, LOCK, EXPORT, ACKNOWLEDGE, CANCEL.
        EXPORT returns the batch plus a CSV string; CANCEL deactivates lines so
        the ledger entries can be batched again.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementCommand"
      responses:
        "200":
          description: Command result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/appeals:
    get:
      tags: [Appeals]
      summary: List appeal cases
      responses:
        "200":
          description: Appeals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Appeals]
      summary: File an appeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppeal"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/appeals/{id}:
    get:
      tags: [Appeals]
      summary: Get an appeal
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Appeal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/appeals/{id}/triage:
    post:
      tags: [Appeals]
      summary: Triage an appeal
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerPersonId]
              properties:
                reviewerPersonId:
                  $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Triaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/appeals/{id}/review:
    post:
      tags: [Appeals]
      summary: Start reviewing a triaged appeal
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: In review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/appeals/{id}/resolve:
    post:
      tags: [Appeals]
      summary: Resolve an appeal
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerPersonId, resolution, rationale]
              properties:
                reviewerPersonId:
