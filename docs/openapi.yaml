openapi: 3.1.0
info:
  title: N-Perform Incentive API
  version: 0.1.0
  description: |
    Institution-agnostic contribution attribution and incentive settlement
    assurance layer. The API core contains no industry policy: policy
    definitions are loaded from policy packs and selected by `calculator`.

    All `/api/v1` requests require authentication. In `AUTH_MODE=oidc` send a
    bearer JWT; in development the `X-Tenant-Id` / `X-User-Id` headers are
    accepted by `DevHeaderAuthenticator`.
  license:
    name: Proprietary
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
  - devTenantHeader: []
    devUserHeader: []
tags:
  - name: System
  - name: Work packages
  - name: Contribution claims
  - name: Attribution
  - name: Evaluation
  - name: Notifications
  - name: Platform
  - name: Policy
  - name: Calculation
  - name: Confirmations
  - name: Compliance
  - name: Approvals
  - name: Budget
  - name: Ledger
  - name: Appeals
  - name: Evidence
  - name: Ingestion
  - name: Agent
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"

  /api/v1/work-packages:
    get:
      tags: [Work packages]
      summary: List work packages
      responses:
        "200":
          description: Work packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Work packages]
      summary: Create a draft work package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkPackage"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/work-packages:accept-batch:
    post:
      tags: [Work packages]
      summary: Accept up to 50 submitted work packages atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [id, reviewerPersonId]
                    properties:
                      id:
                        $ref: "#/components/schemas/Uuid"
                      reviewerPersonId:
                        $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Accepted work packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/work-packages/{id}:
    get:
      tags: [Work packages]
      summary: Get a work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Work package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/work-packages/{id}/versions:
    get:
      tags: [Work packages]
      summary: List commitment snapshots for a work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Version snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/work-packages/{id}/commit:
    post:
      tags: [Work packages]
      summary: Commit a draft work package using optimistic version check
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/work-packages/{id}/start:
    post:
      tags: [Work packages]
      summary: Start an active work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/work-packages/{id}/submit:
    post:
      tags: [Work packages]
      summary: Submit a work package for acceptance
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/work-packages/{id}/accept:
    post:
      tags: [Work packages]
      summary: Accept a delivered work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerPersonId]
              properties:
                reviewerPersonId:
                  $ref: "#/components/schemas/Uuid"
                comments:
                  type: string
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvariantViolation"

  /api/v1/work-packages/{id}/reject:
    post:
      tags: [Work packages]
      summary: Reject a delivered work package
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerPersonId, reason]
              properties:
                reviewerPersonId:
                  $ref: "#/components/schemas/Uuid"
                reason:
                  type: string
                  minLength: 3
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/contribution-claims:
    get:
      tags: [Contribution claims]
      summary: List contribution claims
      responses:
        "200":
          description: Claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Contribution claims]
      summary: Create a contribution claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContributionClaim"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/contribution-claims/{id}:
    get:
      tags: [Contribution claims]
      summary: Get a contribution claim
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/contribution-claims/{id}/submit:
    post:
      tags: [Contribution claims]
      summary: Submit a draft claim
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/attribution-decisions:batch:
    post:
      tags: [Attribution]
      summary: Record up to 50 attribution decisions atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: "#/components/schemas/CreateAttributionDecision"
      responses:
        "201":
          description: Created decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvariantViolation"

  /api/v1/attribution-decisions:
    get:
      tags: [Attribution]
      summary: List attribution decisions
      parameters:
        - name: claimId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Attribution]
      summary: Record an attribution decision
      description: The adjudicator must not be the claimant; an independent reviewer is enforced by domain invariants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttributionDecision"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvariantViolation"

  /api/v1/policy-versions/{id}/diff:
    get:
      tags: [Policy]
      summary: Structural diff against another policy version
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: against
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Policy changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/policy-versions/{id}/legal-gate:
    get:
      tags: [Policy]
      summary: Read the legal gate for a policy version
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Legal gate status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Policy]
      summary: Record legal gate evidence
      description: A formal calculation is blocked until the legal gate is recorded and approved.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordLegalGate"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/notices:
    get:
      tags: [Compliance]
      summary: List employee notices
      responses:
        "200":
          description: Notices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Compliance]
      summary: Publish an employee notice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotice"
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notices/{id}:
    get:
      tags: [Compliance]
      summary: Read an employee notice
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Notice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notices/{id}/acknowledgements:
    get:
      tags: [Compliance]
      summary: Read acknowledgement coverage for a notice
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Summary and acknowledgement rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Compliance]
      summary: Record an acknowledgement or decline
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordAcknowledgement"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/employee-representations:
    get:
      tags: [Compliance]
      summary: List employee representation bodies
      responses:
        "200":
          description: Representations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Compliance]
      summary: Create an employee representation body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRepresentation"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/policy-consultations:
    get:
      tags: [Compliance]
      summary: List policy consultations
      parameters:
        - name: policyVersionId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Consultations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Compliance]
      summary: Record a policy consultation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyConsultation"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/policy-consultations/{id}:
    get:
      tags: [Compliance]
      summary: Read a policy consultation
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Consultation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/policy-consultations/{id}/conclude:
    post:
      tags: [Compliance]
      summary: Conclude a policy consultation
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConcludePolicyConsultation"
      responses:
        "200":
          description: Concluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/dpia-records:
    get:
      tags: [Compliance]
      summary: List DPIA/PIPIA records
      responses:
        "200":
          description: Assessments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Compliance]
      summary: Create a draft DPIA/PIPIA record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDpia"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/dpia-records/{id}:
    get:
      tags: [Compliance]
      summary: Read a DPIA/PIPIA record
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/dpia-records/{id}/approve:
    post:
      tags: [Compliance]
      summary: Approve a DPIA/PIPIA record
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveDpia"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/dsar-requests:
    get:
      tags: [Compliance]
      summary: List data-subject requests
      parameters:
        - name: personId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: DSARs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Compliance]
      summary: Create a data-subject request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDsar"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/dsar-requests/{id}:
    get:
      tags: [Compliance]
      summary: Read a data-subject request
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: DSAR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/dsar-requests/{id}/resolve:
    post:
      tags: [Compliance]
      summary: Resolve or reject a data-subject request
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveDsar"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/recalculation-requests:
    get:
      tags: [Calculation]
      summary: List recalculation requests
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, APPROVED, REJECTED, COMPLETED]
        - name: targetType
          in: query
          required: false
          schema:
            type: string
            enum: [EVIDENCE, ATTRIBUTION, EVALUATION, LEDGER]
      responses:
        "200":
          description: Recalculation requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
