  /api/v1/webhooks/{source}:
    post:
      tags: [Ingestion]
      summary: Receive a signed provider webhook into the inbox
      description: |
        Verifies the source's signature scheme over the exact raw body:
        generic HMAC (`x-signature-256`, optional `x-timestamp` within 300s),
        HubSpot (`x-hubspot-signature-v3`/`x-hubspot-signature`), or Feishu/Lark
        (`x-lark-signature`, `x-lark-request-timestamp`, `x-lark-request-nonce`).
        Configure secrets with `WEBHOOK_SECRET_<SOURCE>` and schemes with
        `WEBHOOK_SCHEME_<SOURCE>`.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
        - name: x-signature-256
          in: header
          required: true
          schema:
            type: string
        - name: x-timestamp
          in: header
          required: false
          schema:
            type: string
        - name: x-message-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Accepted into the inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

