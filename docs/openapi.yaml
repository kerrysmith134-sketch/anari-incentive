    post:
      tags: [AI]
      summary: Generate an advisory model-backed evidence summary
      description: >
        Calls the configured OpenAI-compatible model to summarise evidence and
        propose dimension scores 0-5. Advisory only: the output is written to
        the AI suggestion log and never enters money paths without the
        evaluation gate and human review. Returns 501 when no provider is
        configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelSummary"
      responses:
        "200":
          description: Summary generated and logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "501":
          description: No model provider configured
        "502":
          description: Provider error or invalid model output
