  /api/v1/reports/policy-readiness:
    get:
      tags: [Reporting]
      summary: Report policy evidence and test readiness
      description: |
        Aggregates the legal gate, active golden-case results, linked notice
        acknowledgement coverage, consultations and DPIA status for one policy
        version. `ready` is true only when the legal gate has no blockers, every
        active test case has a passing last run, linked acknowledgement-required
        notices are complete and no referenced DPIA is unapproved.
      parameters:
        - name: policyVersionId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Policy readiness report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/reports/operations-coverage:
    get:
      tags: [Reporting]
      summary: Report evidence and workload coverage
      description: |
        Tenant-wide counts for accepted work packages with work-package
        evidence, claim confirmation, deliverables awaiting acceptance,
        approval requests, data-quality open/overdue/escalated issues and
        DSARs. Ratios are between 0 and 1. `cycleTimes.byResponsibility`
        breaks acceptance, claim decision, confirmation, payroll approval and
        appeal resolution elapsed hours down by responsibility code; payroll
        approval is attributed to every role with a pay line in the run.
        `coverageTrend` and `coverageTrendByPackageType` bucket accepted
        work-package evidence coverage by acceptance month (YYYY-MM), overall
        and per package/task type.
      responses:
        "200":
          description: Operations coverage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/reports/success-metrics:
    get:
      tags: [Reporting]
      summary: Report PRD success metrics with thresholds
      description: |
        Evidence coverage (>=70%), manager review time for decisions issued by
        people with direct reports (<=2h), dispute rate (<10%),
        reconciliation differences (=0), employee evidence supplement time
        (proxy from resolved evidence data-quality issues, <=30m) and the
        latest closed trust survey versus its prior baseline. A metric is
        UNAVAILABLE when no sample or baseline exists; overall is PARTIAL
        when any metric is unavailable.
      responses:
        "200":
          description: Success metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

