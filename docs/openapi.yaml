    get:
      tags: [Reporting]
      summary: Report agent operational acceptance metrics
      description: |
        Closed-task median time, auto-resolution rate, escalation rate, human
        override rate and average attempts. False-positive labels, cost per
        closed loop and the AI-off completion floor are reported as null until
        external review/accounting data exists.
      responses:
        "200":
          description: Agent metrics
          content:
