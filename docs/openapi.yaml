    get:
      tags: [Platform]
      summary: Start Feishu OAuth sign-in
      description: >
        Generates a one-time state (300s TTL) and redirects to Feishu. Returns
        501 with a human-readable message when the deployment has no Feishu
        credentials configured.
      responses:
        "302":
          description: Redirect to Feishu authorize endpoint
        "501":
          description: Feishu sign-in not configured
  /api/v1/auth/feishu/callback:
    get:
      tags: [Platform]
      summary: Feishu OAuth callback
      description: >
        Validates the one-time state, exchanges the code for a user token,
        reads the profile, provisions the basic identity on first sign-in
        (employee role only) and redirects to the console with a local session
        token. Failures redirect to the login page with an explanation.
      responses:
        "302":
          description: Redirect to the console (token) or login (error)
