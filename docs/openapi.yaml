                type: string
              dimension:
                type: string

    SubmitTrustSurveyResponse:
      type: object
      required: [scores]
      properties:
        personId:
          $ref: "#/components/schemas/Uuid"
        scores:
          type: object
          additionalProperties:
            type: number
            minimum: 1
            maximum: 5

    CreateConflictDeclaration:
      type: object
      required: [personId, relatedPersonId, relationshipType, description]
      properties:
        personId:
          $ref: "#/components/schemas/Uuid"
        relatedPersonId:
          $ref: "#/components/schemas/Uuid"
