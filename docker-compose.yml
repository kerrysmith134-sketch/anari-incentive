services:
  postgres:
    image: postgres:16-alpine
    container_name: anari-incentive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anari
      POSTGRES_PASSWORD: anari
      POSTGRES_DB: anari_incentive
    ports:
      - "5432:5432"
    volumes:
      - anari_incentive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anari -d anari_incentive"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://anari:anari@postgres:5432/anari_incentive
    command:
      ["sh", "-c", "npm run db:migrate && npm run db:seed"]

  api:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://anari_app:anari_app@postgres:5432/anari_incentive
      STORE: postgres
      PORT: 3000
      AUTH_MODE: ${AUTH_MODE:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-4000-8000-000000000001}
      DEFAULT_PERSON_ID: ${DEFAULT_PERSON_ID:-00000000-0000-4000-8000-000000000001}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    build: .
    init: true
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://anari_app:anari_app@postgres:5432/anari_incentive
      API_BASE_URL: http://api:3000
      TENANT_ID: ${TENANT_ID:-00000000-0000-4000-8000-000000000001}
      WORKER_PORT: 3100
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-900000}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  anari_incentive_pgdata:
